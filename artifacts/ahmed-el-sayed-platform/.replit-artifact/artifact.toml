kind = "web"
previewPath = "/"
title = "Ahmed El Sayed Platform"
description = "A premium personal brand and business ecosystem website connecting real estate, investment, growth systems, technology, automation, AI, education, and consulting for individuals, investors, and businesses."
version = "1.0.0"
id = "artifacts/ahmed-el-sayed-platform"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24993

[services.development]
run = "pnpm --filter @workspace/ahmed-el-sayed-platform run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ahmed-el-sayed-platform", "run", "build" ]
serve = "static"
publicDir = "artifacts/ahmed-el-sayed-platform/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24993"
BASE_PATH = "/"
